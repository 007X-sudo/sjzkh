</script><script>
'use strict';
const STORAGE_KEY='vision-rookie-lab-v1';
const SUBMIT_CHECKS=['C++ / Python 特性、差异、用途及编译/解释方式举例文档','CMake 配置、构建与运行证据；Anaconda 与虚拟环境截图','任务 1–4 各有 C++ 和 Python 带注释源码与真实运行结果','任务 5 有 C++ 引用版、指针版和 Python 等价版及语义说明','任务 6 包含完整字段、增删改查、展示、八种排序及真实测试','每题都有流程图、自己的设计思路、测试和可选替代设计说明','src 放 C++；script 放 Python；CMakeLists.txt 与实际目标一致','在 Notion 按题目与语言整理，导出 PDF 后打开核对源码/截图/分页','从新终端可以复现，能口述并现场改一条要求，确认截止日期与提交方式'];
const fresh=()=>({version:1,prefs:{minutes:90,days:6,deadline:''},modules:{},evidence:{},submission:{},attempts:[],mistakes:[]});
let state=fresh(),storageOK=true,quiz=null,labType='swap',swapStep=0,swapValues=[3,8],scanStep=0,scanValues=[70,90,80,60,100,75,85,95,65,80],loopStep=0;
const app=document.getElementById('app');
const $=s=>document.querySelector(s);
const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function blankObj(v){return !!v&&typeof v==='object'&&!Array.isArray(v)}
function safeDate(v){return typeof v==='string'&&Number.isFinite(Date.parse(v))?v:''}
function normalize(raw){
 if(!blankObj(raw)||raw.version!==1||!blankObj(raw.prefs)||!blankObj(raw.modules)||!blankObj(raw.evidence)||!Array.isArray(raw.attempts)||!Array.isArray(raw.mistakes))throw new Error('不是本页面支持的 v1 备份');
 const s=fresh(),p=raw.prefs;s.prefs.minutes=Math.max(15,Math.min(480,Number(p.minutes)||90));s.prefs.days=Math.max(1,Math.min(7,Number(p.days)||6));s.prefs.deadline=typeof p.deadline==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(p.deadline)?p.deadline:'';
 for(const m of MODULES){const r=raw.modules[m.id];if(!blankObj(r))continue;const checks={};m.checks.forEach((_,i)=>checks[i]=r.checks?.[i]===true);s.modules[m.id]={checks,note:typeof r.note==='string'?r.note.slice(0,20000):'',doneAt:safeDate(r.doneAt)}}
 for(const t of ASSIGNMENTS){const r=raw.evidence[t.id];if(!blankObj(r))continue;const checks={};t.checks.forEach((_,i)=>checks[i]=r.checks?.[i]===true);s.evidence[t.id]={checks,note:typeof r.note==='string'?r.note.slice(0,20000):''}}
 if(blankObj(raw.submission))SUBMIT_CHECKS.forEach((_,i)=>s.submission[i]=raw.submission[i]===true);
 for(const a of raw.attempts.slice(-200)){if(!blankObj(a)||!Array.isArray(a.answers))continue;const answers=[];for(const x of a.answers){const item=QUESTIONS.find(q=>q.id===x.id);if(item&&Number.isInteger(x.choice)&&x.choice>=0&&x.choice<item.options.length)answers.push({id:item.id,choice:x.choice,correct:x.choice===item.answer})}if(!answers.length)continue;s.attempts.push({date:safeDate(a.date)||new Date().toISOString(),module:MODULES.some(m=>m.id===a.module)?a.module:'',mode:['module','all','wrong'].includes(a.mode)?a.mode:'all',score:answers.filter(x=>x.correct).length,total:answers.length,answers})}
 s.mistakes=[...new Set(raw.mistakes.filter(id=>QUESTIONS.some(q=>q.id===id)))];return s;
}
function warnStorage(message){storageOK=false;$('#storage-warning').textContent=message;$('#storage-warning').classList.remove('hidden');$('#save-status').textContent='请导出备份';}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageOK=true;$('#save-status').textContent='已保存在此浏览器';$('#storage-warning').classList.add('hidden')}catch(_){warnStorage('浏览器无法保存本地进度。本次会话仍可使用，请结束前导出 JSON 备份，避免丢失。')}}
let toastTimer;
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3500)}
const moduleData=id=>state.modules[id]||(state.modules[id]={checks:{},note:'',doneAt:''});
const taskData=id=>state.evidence[id]||(state.evidence[id]={checks:{},note:''});
const latestModule=id=>[...state.attempts].reverse().find(a=>a.mode==='module'&&a.module===id);
const checkCount=(obj)=>Object.values(obj||{}).filter(v=>v===true).length;
function qualified(m){const d=moduleData(m.id),a=latestModule(m.id);return m.checks.every((_,i)=>d.checks[i])&&a&&a.total>0&&a.score/a.total>=.8}
const isDone=m=>!!moduleData(m.id).doneAt&&qualified(m);
const nextModule=()=>MODULES.find(m=>!isDone(m))||MODULES[MODULES.length-1];
const taskDone=t=>t.checks.every((_,i)=>taskData(t.id).checks[i]);
const percent=(a,b)=>b?Math.round(a/b*100):0;
const pct=a=>percent(a.score,a.total);
function dateLocal(iso){try{return new Date(iso).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(_){return '—'}}
function localDay(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dayNum(str){if(!/^\d{4}-\d{2}-\d{2}$/.test(str))return NaN;const [y,m,d]=str.split('-').map(Number);const value=new Date(y,m-1,d);return value.getFullYear()===y&&value.getMonth()===m-1&&value.getDate()===d?Math.floor(Date.UTC(y,m-1,d)/86400000):NaN}
function workload(){const hours=MODULES.filter(m=>!isDone(m)).reduce((s,m)=>s+m.hours,0),buffer=Math.ceil(hours*1.2),sessions=Math.ceil(buffer*60/state.prefs.minutes),weeks=Math.ceil(sessions/state.prefs.days*10)/10;return {hours,buffer,sessions,weeks}}
function planView(){const w=workload(),dl=state.prefs.deadline;let text=`按剩余 ${w.hours} 小时 + 20% 复习缓冲，约需 ${w.buffer} 小时 / ${w.sessions} 次学习 / ${w.weeks} 周。`;if(dl){const days=dayNum(dl)-dayNum(localDay())+1;if(!Number.isFinite(days))text+=' 截止日期无效，请重选。';else if(days<=0)text+=' 你填写的截止日期已过，请确认新的可用时间。';else{const capacity=days/7*state.prefs.days*state.prefs.minutes/60;text+=` 距所填截止日约 ${days} 个日历日，按当前节奏估算可投入 ${capacity.toFixed(1)} 小时。${capacity<w.buffer?'时间不足：先确认截止日期、优先必做项，零基础不可保证短期完成。':'估算时间可覆盖，实际速度仍需根据练习调整。'}`}}return text}
function heading(kicker,title,desc,actions=''){return `<header class="pagehead"><div><p class="eyebrow">${kicker}</p><h1>${title}</h1><p>${desc}</p></div>${actions?`<div class="actions">${actions}</div>`:''}</header>`}
const progressBar=n=>`<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${n}" aria-label="完成进度"><span style="width:${n}%"></span></div>`;
function checkHTML(text,checked,kind,id,index){return `<label class="check"><input type="checkbox" data-check="${kind}" data-id="${id}" data-index="${index}" ${checked?'checked':''}><span>${E(text)}</span></label>`}
const codeBlock=(label,code)=>`<div class="codeblock"><div class="code-title">${label}</div><pre><code>${E(code)}</code></pre></div>`;
function sourceLinks(ids){return ids.map(id=>{const r=RESOURCES.find(r=>r.id===id);return r?`<a href="${r.url}" target="_blank" rel="noopener noreferrer">${E(r.title)}</a>`:''}).join(' · ')}
function home(){const done=MODULES.filter(isDone).length,tDone=ASSIGNMENTS.filter(taskDone).length,next=nextModule(),last=state.attempts.at(-1);return heading('START SMALL. BUILD UNDERSTANDING.','把考核拆成，你今天能完成的一步。','围绕原文六个任务学习；先理解、自己敲、运行测试，再留下能说明过程的证据。')+
`<section class="hero"><div class="hero-text"><span class="tag">YOUR NEXT MISSION · ${E(next.phase)}</span><h2>${E(next.title)}</h2><p>${E(next.goal)}<br>建议课时 ${next.hours} 小时，可拆成多次完成。</p><div class="actions"><a class="btn primary" href="#learn/${next.id}">${done?'继续学习':'从这里开始'} →</a><a class="btn" href="#route">查看完整路线</a></div></div><div class="hero-art" aria-hidden="true"><div class="orb"><div class="focus-corner"></div><div class="orb-inner"><strong>INPUT</strong><small>THINK → CODE → TEST</small></div><span class="orb-caption">FOCUS ON THE NEXT SMALL STEP</span></div></div></section>
<section class="stats" aria-label="学习概况"><div class="stat"><div class="number">${done}<span> / 16</span></div><div class="label">阶段通过自检</div>${progressBar(percent(done,16))}</div><div class="stat"><div class="number">${tDone}<span> / 6</span></div><div class="label">任务材料勾选齐全</div>${progressBar(percent(tDone,6))}</div><div class="stat"><div class="number">${last?pct(last)+'<span>%</span>':'—'}</div><div class="label">最近一次概念自测</div><div class="subtle">${last?last.score+' / '+last.total+' 题':'学完一节，再来检测'}</div></div><div class="stat"><div class="number">${state.mistakes.length}<span> 题</span></div><div class="label">待复习错题</div><a href="#quiz" class="subtle">去复习 →</a></div></section>
<div class="grid-main"><div><section class="card"><div class="section-row"><h2>你的学习节奏</h2><span class="badge">可随时调整</span></div><div class="form-row"><label class="field">每次学习（分钟）<select data-pref="minutes">${[15,30,45,60,90,120,180,240,360,480].map(v=>`<option value="${v}" ${Number(state.prefs.minutes)===v?'selected':''}>${v} 分钟</option>`).join('')}</select></label><label class="field">每周学习天数<select data-pref="days">${[1,2,3,4,5,6,7].map(v=>`<option value="${v}" ${Number(state.prefs.days)===v?'selected':''}>${v} 天</option>`).join('')}</select></label><label class="field">截止日期（可不填）<input type="date" data-pref="deadline" value="${E(state.prefs.deadline)}"></label></div><p class="note" id="plan-text">${E(planView())}</p><p class="subtle">完整路线估算 66 小时；另留 20% 复习与调试缓冲，取整约 80 小时。这是本工具的学习估算，不是原文时限或通过承诺。跳过加分项，不跳必做项。</p></section><section class="card"><div class="section-row"><h2>一条能走完的路线</h2><a class="back-link" href="#route">全部 16 阶段 →</a></div><ol class="road-mini">${[{name:'准备与环境',sub:'看懂要求 → CMake → Anaconda',ids:['m0','m1']},{name:'基础题，两种语言各做一次',sub:'变量 / 循环 / 函数 / 数组 / 交换',ids:MODULES.slice(2,12).map(m=>m.id)},{name:'类与对象，完成学生系统',sub:'先设计，再按功能逐个验证',ids:['m12','m13','m14']},{name:'整理材料，练习解释',sub:'真实输出 / 流程图 / 设计思路',ids:['m15']}].map((s,i)=>{const n=s.ids.filter(id=>isDone(MODULES.find(m=>m.id===id))).length;return `<li><span class="step-no ${n===s.ids.length?'done':''}">${n===s.ids.length?'✓':'0'+(i+1)}</span><div class="step-text"><strong>${s.name}</strong><small>${s.sub}</small></div><span class="subtle">${n}/${s.ids.length}</span></li>`}).join('')}</ol></section></div><div><section class="card"><div class="section-row"><h2>第一次，就做这 90 分钟</h2><span class="badge warm">起步建议</span></div><p class="start-line"><b>00–20 分</b> 读要求，列交付物与疑问</p><p class="start-line"><b>20–35 分</b> 认识文件、终端与程序</p><p class="start-line"><b>35–75 分</b> 按一种工具链搭环境</p><p class="start-line"><b>75–90 分</b> 记录结果、报错和下一步</p><div class="note warn">环境没配好时停下来解决。第一次不要求同时写出两个语言的全部程序。</div><a class="btn small" href="#resources">打开环境指南 →</a></section><section class="card"><h2>怎样才算真的学会？</h2><div class="pill-row"><span class="pills">能预测输出</span><span class="pills">能独立编写</span><span class="pills">能解释关键行</span><span class="pills">能改一条要求</span></div><p class="subtle">每阶段先完成练习清单，再做概念自测。80% 是本工具建议的复习线，官方考核没有给出此线。代码与提交材料仍需你亲自验收。</p></section></div></div>`}
function route(){return heading('16 STAGES · ONE CLEAR PATH','按任务学习，不把整门课程先看完。','相同概念先学清楚，再切换语言实现。课时是估算，不等于固定一天；前置没掌握时先补，不盲目赶进度。')+`<div class="note">推荐顺序：要求与环境 → 任务 1 → 任务 2 → 任务 3 → 任务 4 → 任务 5 → 类与对象 → 学生系统 → 交付。当前剩余估算 ${workload().hours} 小时（不含缓冲）。</div><section>${MODULES.map((m,i)=>{const d=moduleData(m.id),done=isDone(m),a=latestModule(m.id),n=checkCount(d.checks);return `<article class="route-card ${done?'complete':''}"><div class="route-index">${String(i+1).padStart(2,'0')}</div><div class="route-body"><h2>${E(m.title)}</h2><p>${E(m.goal)}</p><div class="route-meta"><span class="badge">${m.phase}</span><span class="subtle">约 ${m.hours} 小时 · ${m.pages}</span><span class="status-pill">${done?'✓ 已通过自检':n?'练习 '+n+'/'+m.checks.length:'尚未开始'}${a?' · 自测 '+pct(a)+'%':''}</span></div></div><div class="route-side"><a class="btn small" href="#learn/${m.id}">${done?'复习':'打开阶段'} →</a></div></article>`}).join('')}</section>`}
function learn(id){const m=MODULES.find(m=>m.id===id)||MODULES[0],index=MODULES.indexOf(m),d=moduleData(m.id),a=latestModule(m.id),done=isDone(m);return heading('LEARN → PRACTICE → EXPLAIN',`${String(index+1).padStart(2,'0')} / ${E(m.title)}`,`${E(m.goal)} · 约 ${m.hours} 小时`, '<a class="btn small" href="#route">返回路线</a>')+`<div class="module-layout"><div><div class="note">对应：${E(m.task)} · ${E(m.pages)}。学习卡为讲解建议，考核原文为要求依据。${index&&!isDone(MODULES[index-1])?'前一阶段尚未完成，可先返回补齐前置知识。':''}</div><section class="card concepts"><h2>先读懂这几个概念</h2>${m.concepts.map((text,i)=>`<p><span class="concept-number">${i+1}</span>${E(text)}</p>`).join('')}<div class="source-line">进一步查阅：${sourceLinks(m.sources)}</div></section><section class="card"><h2>最小例子 · 先预测，再手敲</h2><div class="code-pair">${codeBlock('C++',m.cpp)}${codeBlock('PYTHON',m.py)}</div><p class="subtle">只用来理解概念；考核原题请在自己的编辑器独立完成。这里不执行代码。</p><h3>迁移练习</h3><p>${E(m.practice)}</p></section><section class="card"><h2>这一阶段，你要做的事</h2><ol class="module-steps">${m.steps.map(s=>`<li>${E(s)}</li>`).join('')}</ol><div class="note warn"><b>容易卡住：</b>${E(m.pitfall)}</div></section><section class="card"><h2>合上资料，试着说出来</h2><p>${E(m.recall)}</p><p class="subtle">先自己解释；答不出来，再回看对应概念。不要把“眼熟”当成掌握。</p><label class="field">我的理解 / 真实测试记录 / 还没解决的问题<textarea data-note="module" data-id="${m.id}" maxlength="20000" placeholder="例如：我原来以为……，运行后发现……。输入了什么？期待什么？实际是什么？">${E(d.note)}</textarea></label><div class="actions" style="margin-top:12px"><button class="btn small" data-action="mentor" data-id="${m.id}">生成提问模板</button><button class="btn small" data-action="export-notes">导出学习记录</button></div><p class="subtle" id="mentor-result"></p></section><div class="actions">${index?`<a class="btn" href="#learn/${MODULES[index-1].id}">← 上一阶段</a>`:''}${index<15?`<a class="btn" href="#learn/${MODULES[index+1].id}">下一阶段 →</a>`:'<a class="btn primary" href="#submit">检查提交材料 →</a>'}</div></div><aside class="module-aside"><section class="card"><h2>本阶段验收</h2><p class="subtle">以下是自我检查，请只勾选已实际做到的项目。</p>${m.checks.map((c,i)=>checkHTML(c,d.checks[i],'module',m.id,i)).join('')}<div class="lesson-progress">练习 ${checkCount(d.checks)}/${m.checks.length} · 最近概念自测 ${a?pct(a)+'%':'未参加'}</div>${progressBar(percent(checkCount(d.checks),m.checks.length))}<button class="btn primary" style="width:100%" data-action="module-quiz" data-id="${m.id}">做本阶段概念自测</button><button class="btn" style="width:100%;margin-top:9px" data-action="complete" data-id="${m.id}" ${qualified(m)&&!done?'':'disabled'}>${done?'✓ 已通过阶段自检':'确认通过本阶段'}</button><p class="subtle">须勾选所有练习项，并在最近一次本阶段自测达到 80%，才可确认。题少时需全部正确。自检不代表官方通过。</p></section></aside></div>`}
function tasks(id){const t=ASSIGNMENTS.find(t=>t.id===id);if(!t)return heading('DELIVERABLES FIRST','六项任务，都有明确的验收标准。','每题先看要求与测试，再独立实现。这里不提供原题整套答案，也不会把粘贴的代码冒充已通过测试。')+`<div class="task-grid">${ASSIGNMENTS.map((t,i)=>`<article class="task-tile"><div class="section-row"><span class="task-number">TASK 0${i+1}</span><span class="badge ${taskDone(t)?'':'warm'}">${t.label}</span></div><h2>${t.name}</h2><p>${t.req}</p><div class="section-row"><span class="subtle">材料自检 ${checkCount(taskData(t.id).checks)}/${t.checks.length}</span><a class="btn small" href="#tasks/${t.id}">打开验收 →</a></div>${progressBar(percent(checkCount(taskData(t.id).checks),t.checks.length))}</article>`).join('')}</div>`;
const d=taskData(t.id);return heading('TASK '+t.id.slice(1)+' · INDEPENDENT PRACTICE',E(t.name),E(t.req),'<a class="btn small" href="#tasks">全部任务</a>')+`<div class="grid-main"><div><section class="card"><div class="section-row"><h2>写之前，先拆问题</h2><span class="badge">${t.label}</span></div><p class="subtle">先花 10–15 分钟自己尝试，再逐级展开提示；尝试时间是学习建议。</p>${t.steps.map((s,i)=>`<details class="detail"><summary>提示 ${i+1} · ${['先想输入与数据','再想处理过程','最后想验证与边界'][i]}</summary><p>${E(s)}</p></details>`).join('')}<a class="btn small" href="#learn/${t.module}">回到对应学习阶段 →</a></section><section class="card"><h2>先写期望结果，再运行你的程序</h2><div class="table-wrap"><table><thead><tr><th scope="col">输入或检查项</th><th scope="col">期望结果 / 验证点</th></tr></thead><tbody>${t.cases.map(c=>`<tr><td>${E(c[0])}</td><td>${E(c[1])}</td></tr>`).join('')}</tbody></table></div><p class="subtle">这是测试参考表，不是真实运行结果。请在本地运行你自己的 C++ / Python 并保存证据。</p></section><section class="card"><h2>留下一份你自己的思路</h2><p class="subtle">建议写：输入 → 算法 → 数据结构 → 边界 → 实测 → 失败与修复 → 替代方案。</p><label class="field">设计与测试记录<textarea data-note="task" data-id="${t.id}" maxlength="20000" placeholder="写下真实过程，以及每个测试的实际输出和证据文件位置。">${E(d.note)}</textarea></label><div class="note"><b>答辩练习：</b>${E(t.review)}</div></section></div><aside><section class="card"><h2>材料与运行自检</h2>${t.checks.map((c,i)=>checkHTML(c,d.checks[i],'task',t.id,i)).join('')}<p class="subtle">此清单由你确认，网页没有执行或检查源码。只勾选有证据的项目。</p><button class="btn small" data-action="export-notes">导出本人的学习记录</button></section></aside></div>`}
function quizPage(){return heading('RETRIEVAL PRACTICE','先回忆，再核对。把不懂的地方找出来。','41 道概念题；选项会打乱。80% 是本工具建议的复习线，不是官方通过线。真实编程与口述另行验收。')+`<section class="card"><div class="form-row"><label class="field wide">选择检测范围<select id="quiz-scope"><option value="all">综合抽测 · 随机 10 题</option><option value="wrong">错题复习 · 当前 ${state.mistakes.length} 题（至多 10 题）</option>${MODULES.map((m,i)=>`<option value="${m.id}">${i+1}. ${m.title} · ${QUESTIONS.filter(q=>q.module===m.id).length} 题</option>`).join('')}</select></label><button class="btn primary" data-action="start-quiz">开始检测</button></div><p class="subtle">先独立作答，提交后才显示解析；答错自动加入待复习题，之后独立答对会移出待复习列表。历史记录保留最近 200 次；当前未提交的作答刷新后会丢失。</p></section><div id="quiz-area">${quiz?renderQuiz():''}</div><section class="card"><h2>最近的自测记录</h2>${state.attempts.length?[...state.attempts].reverse().slice(0,8).map(a=>`<div class="quiz-result-row"><span>${dateLocal(a.date)} · ${a.mode==='module'?E(MODULES.find(m=>m.id===a.module)?.title||'阶段自测'):a.mode==='wrong'?'错题复习':'综合抽测'}</span><b>${a.score}/${a.total} · ${pct(a)}%</b></div>`).join(''):'<p class="subtle">暂时没有记录。学完第一阶段后做一次小测。</p>'}</section>`}
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(scope){let items,mode='module',mid='';if(scope==='all'){mode='all';items=shuffle(QUESTIONS).slice(0,10)}else if(scope==='wrong'){mode='wrong';items=shuffle(QUESTIONS.filter(q=>state.mistakes.includes(q.id))).slice(0,10)}else{mid=scope;items=shuffle(QUESTIONS.filter(q=>q.module===scope))}if(!items.length){toast('当前没有待复习错题，先学习或做一次综合检测。');return}quiz={items:items.map(q=>({q,order:shuffle(q.options.map((_,i)=>i))})),mode,module:mid,answers:{},submitted:false};if(location.hash==='#quiz')render(false);else location.hash='quiz'}
function renderQuiz(){if(!quiz)return '';const score=quiz.items.filter(x=>quiz.answers[x.q.id]===x.q.answer).length;return `<section aria-label="当前自测"><div class="section-row"><h2 style="font-size:17px;margin:0">${quiz.mode==='module'?E(MODULES.find(m=>m.id===quiz.module)?.title):quiz.mode==='wrong'?'错题复习':'综合抽测'}</h2><span class="badge">共 ${quiz.items.length} 题</span></div>${quiz.submitted?`<div class="quiz-banner" role="status"><strong>${percent(score,quiz.items.length)}%</strong> · ${score}/${quiz.items.length} 题正确<p class="subtle">${score/quiz.items.length>=.8?'本次达到建议复习线；接下来还需编程与口述验证。':'先看解析，再回到对应阶段补练。'} 现在有 ${state.mistakes.length} 道待复习题。</p><div class="actions">${quiz.module?`<a class="btn small" href="#learn/${quiz.module}">返回本阶段验收 →</a>`:''}<button class="btn small" data-action="retry-quiz">换序再测</button></div></div>`:''}${quiz.items.map((item,i)=>{const q=item.q;return `<div class="quiz-item" id="item-${q.id}"><fieldset ${quiz.submitted?'disabled':''}><legend>${i+1}. ${E(q.prompt)}</legend>${item.order.map((idx,n)=>`<label class="option ${quiz.submitted?(idx===q.answer?'correct':quiz.answers[q.id]===idx?'wrong':''):''}"><input type="radio" name="${q.id}" value="${idx}" data-question="${q.id}" ${quiz.answers[q.id]===idx?'checked':''}><span>${String.fromCharCode(65+n)}. ${E(q.options[idx])}${quiz.submitted&&idx===q.answer?' ✓':''}</span></label>`).join('')}</fieldset>${quiz.submitted?`<p class="answer-explain">${quiz.answers[q.id]===q.answer?'✓ 回答正确':'需要复习'}：${E(q.why)}<br><a href="#learn/${q.module}">回到对应知识卡 →</a></p>`:''}</div>`}).join('')}${quiz.submitted?'':`<div class="actions"><button class="btn primary" data-action="submit-quiz">提交并查看解析</button><span class="subtle">全部作答后提交；不会因未选择而偷偷扣分。</span></div>`}</section>`}
function submitQuiz(){if(!quiz||quiz.submitted)return;const missing=quiz.items.find(x=>!Object.hasOwn(quiz.answers,x.q.id));if(missing){toast('还有题目未作答，请先完成所有选择。');document.getElementById('item-'+missing.q.id)?.scrollIntoView({behavior:'smooth',block:'center'});return}const answers=quiz.items.map(({q})=>({id:q.id,choice:quiz.answers[q.id],correct:quiz.answers[q.id]===q.answer}));const mistakes=new Set(state.mistakes);answers.forEach(a=>a.correct?mistakes.delete(a.id):mistakes.add(a.id));state.mistakes=[...mistakes];state.attempts.push({date:new Date().toISOString(),mode:quiz.mode,module:quiz.module,score:answers.filter(a=>a.correct).length,total:answers.length,answers});state.attempts=state.attempts.slice(-200);quiz.submitted=true;save();render(false);$('#quiz-area').scrollIntoView({behavior:'smooth',block:'start'})}
function submission(){return heading('SHOW YOUR REASONING','交付的是能解释的作品，不只是输出。','原文要求 + 真实验证 + 你的设计取舍。学习记录只辅助整理，不自动成为正式作业。')+`<div class="grid-main"><div><section class="card"><h2>最后一遍，对照清单</h2>${SUBMIT_CHECKS.map((text,i)=>checkHTML(text,state.submission[i],'submission','all',i)).join('')}${progressBar(percent(checkCount(state.submission),SUBMIT_CHECKS.length))}<p class="subtle">${checkCount(state.submission)}/${SUBMIT_CHECKS.length} 项材料自检；由你确认，不代表自动判卷或官方通过。</p></section><section class="card"><h2>建议目录 · 对齐原文第 4 页</h2><div class="directory"><pre>SECOND_STUDY/\n├── CMakeLists.txt    # 每个任务设独立可执行目标\n├── src/              # C++ 源码\n├── script/           # Python 脚本\n├── include/          # 如有头文件\n├── build/            # 构建生成内容\n├── .vscode/          # 如使用 VS Code\n├── docs/             # 建议：比较文档、流程图、导出 PDF\n└── screenshots/      # 建议：真实环境与运行截图</pre></div><p class="subtle">docs 与 screenshots 是整理建议；include/.vscode 按实际工程使用。不要为了目录外观做不理解的配置。</p><button class="btn small" data-action="template">下载空白报告模板（Markdown）</button></section><section class="card"><h2>流程图怎么画？先用纸就可以</h2><p class="subtle">圆角框 = 开始 / 结束；平行四边形 = 输入 / 输出；矩形 = 处理；菱形 = 条件判断。箭头表示执行顺序，判断出口标“是 / 否”，循环要画回到条件的箭头。</p><svg viewBox="0 0 600 100" width="100%" role="img" aria-label="通用流程示意：开始，输入，处理，输出，结束"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#61814c"/></marker></defs><g fill="#eef5e4" stroke="#92ad79"><rect x="3" y="27" width="76" height="46" rx="22"/><path d="M115,27 H205 L190,73 H100 Z"/><rect x="237" y="27" width="94" height="46" rx="3"/><path d="M378,27 H468 L453,73 H363 Z"/><rect x="509" y="27" width="85" height="46" rx="22"/></g><g stroke="#61814c" marker-end="url(#arr)"><path d="M81,50 H99"/><path d="M206,50 H235"/><path d="M333,50 H362"/><path d="M469,50 H507"/></g><g fill="#3e613a" font-size="14" text-anchor="middle"><text x="41" y="55">开始</text><text x="153" y="55">输入</text><text x="284" y="55">处理</text><text x="416" y="55">输出</text><text x="552" y="55">结束</text></g></svg><p class="subtle">这是通用示意，不能直接代替你的六题流程图。每题先列自然语言步骤，再逐一换成对应图形。手画后拍清楚也可用来练习；正式提交方式以队伍要求为准。检查：每条箭头通到哪里？分支齐不齐？循环何时结束？</p></section><section class="card"><h2>模拟答辩 · 不看资料口述</h2><ol class="module-steps"><li>从一条输入到输出，讲清平均分程序的类型、公式与格式。</li><li>讲素数的定义，现场推演 1、2、9、49 的执行路径。</li><li>用盒子和箭头说明 C++ 值、引用、指针，说明 Python 等价交换。</li><li>解释学生类为什么这样设计；比较两种存储结构。</li><li>演示修改某科成绩后总分同步；排序后按学号找到同一人。</li><li>任选一题改一个小要求，现场运行；遇错能读出首个关键报错。</li></ol><div class="rubric"><div><h3>暂未掌握</h3>只能认代码，解释依赖原答案，改动后不知道怎样验证。</div><div><h3>正在形成能力</h3>能说思路，参考资料可完成；关键边界还容易漏。</div><div><h3>建议的就绪状态</h3>独立实现并通过边界测试，能解释与小改，不以背输出代替理解。</div></div></section></div><aside><section class="card"><h2>保存你的学习过程</h2><p class="subtle">本地保存不等于云备份。清理浏览器、更换浏览器或移动 HTML 文件后可能读不到原记录。</p><div class="actions"><button class="btn primary" data-action="export-backup">导出 JSON 备份</button><button class="btn" data-action="import">导入备份</button><button class="btn" data-action="export-notes">导出学习记录</button></div><p class="subtle">导入会替换当前进度，确认前请备份。记录只存在你的设备；网页没有上传接口。</p><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><button class="btn small danger" data-action="reset">清空本页面学习进度</button></section><section class="card"><h2>加分项放在最后</h2><p class="subtle">原文提到 Flask、HTML、JS、MySQL 的可视化前后端加分项，并允许该前端使用 AI 辅助。先完成控制台系统与所有基础交付，再考虑加分。这个学习网页本身不等于你的学生管理系统加分项。</p></section></aside></div>`}
function resources(){return heading('REFERENCE, NOT ENDLESS WATCHING','只查当前任务需要的知识。','优先原始教程和官方文档。以下链接需要联网，内容会更新；命令为最小学习示例，实际安装按相应系统的官方说明。')+`<section class="card"><h2>考核要求与本工具建议，分开看</h2><div class="table-wrap"><table><thead><tr><th>原文位置</th><th>考核内容</th><th>本工具的安排 / 待确认点</th></tr></thead><tbody><tr><td>第 1–2 页</td><td>两门语言基础、数组、指针引用、类与对象</td><td>16 阶段覆盖；虽前文“到类/面向对象前面”有歧义，按后文明确列出的类与对象学习；暂不扩展继承多态</td></tr><tr><td>第 2 页</td><td>语言比较文档、CMake、Anaconda 虚拟环境截图；前五题双语言</td><td>系统环境未明确；Ubuntu 出现在参考安装链接，是否必须使用应确认</td></tr><tr><td>第 2–3 页</td><td>六个题目；交换含 C++ 引用和指针；系统任选一种语言</td><td>Python 无同样的 int&/int* 参数语法，学习等价功能并说明差异；“5 人”与插入删除容量含义待确认</td></tr><tr><td>第 3–4 页</td><td>注释源码、结果、流程图、设计与替代方案；src/script、Notion 导出 PDF</td><td>任务清单、记录模板与答辩检查；80% 自测线和 66 小时为学习建议，非原文规定</td></tr></tbody></table></div><div class="note warn">原文没有截止日期、每日时长和官方分数线。本工具不会替出题人补造规则，也不会因 AI 生成代码能运行就标记你已掌握。</div></section><section class="card"><h2>环境路线 · 先选一种操作系统</h2><p class="subtle">本轮只指导，不在你的电脑自动安装软件。先向队伍确认要求，再选一条路线。命令中的点表示“当前项目根目录”。</p><details class="detail"><summary>Windows：VS Code + MSVC 工具链 + CMake + Anaconda</summary><ol class="walkthrough"><li>按 VS Code 官方 MSVC 指南安装 C++ Build Tools 中的 C++ 桌面开发组件；VS Code 扩展不能代替编译器。安装 CMake 后，在新终端检查 cmake --version。</li><li>使用安装工具链提供的 Developer Command Prompt 或 Developer PowerShell，进入 SECOND_STUDY 根目录。普通终端可能找不到 cl，不要盲目改系统路径。</li><li>将知识卡最小程序保存为 src/hello.cpp；使用下面最小 CMake 文件。先配置、构建，再在 build 下找到 hello.exe。Visual Studio 生成器常在 build/Debug 下。</li><li>安装 Anaconda 后打开 Anaconda Prompt，按下面步骤创建并激活项目环境，运行 script/hello.py。</li></ol><div class="source-line">${sourceLinks(['msvc','cmake','install','conda'])}</div></details><details class="detail"><summary>Ubuntu / Linux：按队伍环境要求安装编译器、CMake 与 Anaconda</summary><ol class="walkthrough"><li>先确认当前 Linux 发行版与架构，按发行版说明安装 C++ 编译工具及 CMake，检查 c++ --version、cmake --version。</li><li>不要因为本文件提供 Linux 路线就在 Windows 直接执行 Linux 安装命令。WSL/双系统是否需要先向队伍确认。</li><li>按 Anaconda 官方 Linux 说明获取并核验安装包，完成 shell 初始化后重开终端；创建独立环境。</li><li>从项目根目录配置与构建。单配置生成器的示例程序通常位于 ./build/hello；以你的实际生成位置为准。</li></ol><div class="source-line">${sourceLinks(['cmake','install','conda'])}</div></details><h3>最小 CMake 工程 · 只是环境示例</h3>${codeBlock('CMakeLists.txt · 项目根目录','cmake_minimum_required(VERSION 3.15)\nproject(SecondStudy LANGUAGES CXX)\nset(CMAKE_CXX_STANDARD 17)\nset(CMAKE_CXX_STANDARD_REQUIRED ON)\nadd_executable(hello src/hello.cpp)')}<p class="subtle">3.15 是该简单配置的最低声明，不是要求安装旧版本；现有较新 CMake 可用。此处 C++17 是学习配置选择，不是考核指定标准。后续每个 main 对应独立目标。</p>${codeBlock('TERMINAL · 在项目根目录运行','cmake --version\ncmake -S . -B build\ncmake --build build\n# 之后运行实际生成的 hello / hello.exe\n# Windows Visual Studio 默认 Debug 目标常为：.\\build\\Debug\\hello.exe\n# Linux 单配置生成器常为：./build/hello')}<h3>创建独立 Conda 环境 · 记录解释器路径</h3>${codeBlock('ANACONDA PROMPT / 初始化好的 shell','conda --version\nconda create -n second_study python\nconda activate second_study\npython --version\npython -c "import sys; print(sys.executable)"\npython script/hello.py')}<p class="subtle">若队伍指定 Python 版本，在创建环境时用其版本；未指定时不人为要求某个旧版本。保留环境名、版本和路径截图。</p><h3>卡住时，先收集四样东西</h3><ul class="reading"><li>我在哪个系统、哪个终端、当前路径是什么？</li><li>我输入的完整命令是什么？</li><li>第一条关键错误及其附近原文是什么？</li><li>我期待什么、实际发生什么、已经尝试过什么？</li></ul></section><section class="card"><h2>少量、按需查阅的资料</h2>${RESOURCES.map(r=>`<article class="resource"><div><span class="badge">${r.type}</span> <strong>${E(r.title)}</strong><p>${E(r.scope)}</p></div><a class="btn small" href="${r.url}" target="_blank" rel="noopener noreferrer">打开资料 ↗</a></article>`).join('')}<p class="subtle">内容为本工具原创学习讲解，外链提供后续查阅。每次只学当前阶段，不必追完整课程目录。</p></section>`}
function lab(){return heading('SEE THE PROGRAM THINK','看见变量怎样变，循环怎样走。','这些是概念演示，不是考核程序的真实执行结果。先预测下一步，再点按钮，最后在自己的代码里验证。')+`<div class="lab-tabs" role="group" aria-label="选择演示">${[['swap','交换与信息保存'],['scan','数组遍历找最大'],['prime','素数与因数'],['loop','嵌套循环']].map(([id,text])=>`<button class="btn ${labType===id?'active':''}" aria-pressed="${labType===id}" data-action="lab-tab" data-id="${id}">${text}</button>`).join('')}</div><section class="card" id="lab-stage">${labContent()}</section>`}
function labContent(){if(labType==='swap'){let [x,y]=swapValues,t='—';if(swapStep>=1)t=x;if(swapStep>=2)x=y;if(swapStep>=3)y=t;const logs=['初始状态：先想怎样不丢掉 a 的旧值。','temp = a；先保存 a 的旧值。','a = b；把 b 的值放进 a，旧值仍在 temp。','b = temp；把旧的 a 放进 b，交换完成。'];return `<h2>交换需要保住原来的信息</h2><div class="form-row"><label class="field">初始 a<input id="swap-a" type="number" min="-100000" max="100000" step="1" value="${swapValues[0]}"></label><label class="field">初始 b<input id="swap-b" type="number" min="-100000" max="100000" step="1" value="${swapValues[1]}"></label><button class="btn" data-action="swap-reset">用这些值重新开始</button></div><div class="boxes"><div class="box"><small>变量 a</small><strong>${x}</strong></div><div class="box"><small>临时 temp</small><strong>${t}</strong></div><div class="box"><small>变量 b</small><strong>${y}</strong></div></div><div class="swap-log" role="status">第 ${swapStep}/3 步：${logs[swapStep]}</div><div class="actions" style="margin-top:16px"><button class="btn primary" data-action="swap-next" ${swapStep>=3?'disabled':''}>下一步 →</button><span class="subtle">每点一次只做一次赋值</span></div><p class="note">对比错误步骤 a=b; b=a;，原来的 a 在第一步已丢失。C++ 引用/指针决定“修改的是谁”，临时变量决定“怎么不丢数据”。</p>`}
if(labType==='scan'){const current=scanValues.slice(0,scanStep),max=current.length?Math.max(...current):null;return `<h2>逐个看，记住“目前最大的”</h2><p class="subtle">示例数据为教学数据。先拿第一个元素作当前最大值，再逐项比较。</p><div class="array-bars">${scanValues.map((v,i)=>`<div class="barcol ${i===scanStep-1?'current':''}"><b>${v}</b><div class="bar" style="height:${v*1.25}px;opacity:${i<scanStep?1:.28}"></div><small>[${i}]</small></div>`).join('')}</div><div class="note" role="status">已看 ${scanStep}/10 个 · 当前最大值：<b>${max??'尚未初始化'}</b>${scanStep?` · 当前读取索引 ${scanStep-1}`:''}</div><div class="actions"><button class="btn primary" data-action="scan-next" ${scanStep>=10?'disabled':''}>读取下一个 →</button><button class="btn" data-action="scan-reset">重置</button></div><p class="subtle">先预测：下一个值大于当前最大值吗？此处只解释最大值遍历，不代替任务 4 的四类输出。</p>`}
if(labType==='prime')return `<h2>能找到一个其他因数，就不是素数</h2><div class="form-row"><label class="field">输入 -50 到 200 的整数<input id="prime-n" type="number" min="-50" max="200" step="1" value="49"></label><button class="btn primary" data-action="prime-run">观察试除</button></div><div id="prime-output" class="note">先预测 49 是否为素数，再观察除数 2 到 7。</div><p class="subtle">演示采用到平方根的试除，只展示到首个因数；不要忘掉小于 2 和完全平方数边界。</p>`;
const positions=[];for(let i=1;i<=9;i++)for(let j=1;j<=i;j++)positions.push([i,j]);const p=positions[Math.max(0,loopStep-1)];return `<h2>外层走一行，内层走这一行的算式</h2><p class="subtle">外层 i = 行号；内层 j = 1 到 i。灰色空白不应输出内容。</p><div class="loop-grid">${Array.from({length:9},(_,ri)=>Array.from({length:9},(_,ci)=>{const i=ri+1,j=ci+1,idx=i*(i-1)/2+j;return `<div class="loop-cell ${j>i?'dim':idx===loopStep?'active':idx<loopStep?'past':''}">${j}×${i}=${i*j}</div>`}).join('')).join('')}</div><div class="note" role="status">第 ${loopStep}/45 项${loopStep?` · 当前 i=${p[0]}, j=${p[1]}`:' · 尚未开始'}${loopStep&&p[0]===p[1]?' · 本行完成，需要换行':''}</div><div class="actions"><button class="btn primary" data-action="loop-next" ${loopStep>=45?'disabled':''}>输出下一个 →</button><button class="btn" data-action="loop-reset">重置</button></div>`}
function render(scroll=true){const [section,id]=(location.hash.slice(1)||'home').split('/');const known=['home','route','learn','tasks','quiz','lab','submit','resources'];const view=known.includes(section)?section:'home';document.querySelectorAll('[data-nav]').forEach(a=>{const active=a.dataset.nav===view;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});app.innerHTML=view==='home'?home():view==='route'?route():view==='learn'?learn(id):view==='tasks'?tasks(id):view==='quiz'?quizPage():view==='lab'?lab():view==='submit'?submission():resources();document.title=({home:'学习总览',route:'学习路线',learn:'知识与练习',tasks:'任务验收',quiz:'自测与错题',lab:'可视化实验室',submit:'提交与答辩',resources:'资料与环境'}[view])+' · 视觉组学习工作台';if(scroll)window.scrollTo({top:0,behavior:'instant'})}
function downloadFile(name,text,type){const blob=new Blob([text],{type:type||'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('已生成文件；请在浏览器下载位置查看。')}
function exportNotes(){const lines=['# 视觉组考核 · 我的学习记录',`导出时间：${new Date().toLocaleString('zh-CN')}`,'这是一份个人学习记录，不是官方评分，也不替代源代码与真实运行证据。','',`学习节奏：每次 ${state.prefs.minutes} 分钟，每周 ${state.prefs.days} 天。`,state.prefs.deadline?`自填截止日期：${state.prefs.deadline}`:'尚未填写截止日期。',''];for(const m of MODULES){const d=moduleData(m.id),a=latestModule(m.id);lines.push(`## ${m.title}`,`状态：${isDone(m)?'通过本工具自检':'待完成'}；最近阶段概念自测：${a?pct(a)+'%':'未参加'}。`,...m.checks.map((c,i)=>`- [${d.checks[i]?'x':' '}] ${c}`),'','### 我的记录',d.note||'（尚未记录）','')}lines.push('# 六项任务运行与材料自检');for(const t of ASSIGNMENTS){const d=taskData(t.id);lines.push(`## ${t.name}`,...t.checks.map((c,i)=>`- [${d.checks[i]?'x':' '}] ${c}`),'',d.note||'（尚未记录真实设计与测试）','')}lines.push('# 最终提交清单',...SUBMIT_CHECKS.map((c,i)=>`- [${state.submission[i]?'x':' '}] ${c}`),'','# 概念自测历史');state.attempts.forEach(a=>lines.push(`- ${dateLocal(a.date)}：${a.mode==='module'?MODULES.find(m=>m.id===a.module)?.title||'阶段':a.mode==='wrong'?'错题复习':'综合'}；${a.score}/${a.total} (${pct(a)}%)`));lines.push('','# 待复习题',...state.mistakes.map(id=>'- '+QUESTIONS.find(q=>q.id===id).prompt));downloadFile('视觉组学习记录-'+localDay()+'.md',lines.join('\n'),'text/markdown;charset=utf-8')}
function reportTemplate(){const lines=['# 视觉组第二次考核 · 报告填写模板','> 在 Notion 整理后导出 PDF。所有空项请填写本人真实内容；本模板不是已完成作业。','','## 1. 语言比较','- C++ / Python 特性、类型、常见用途与差异：','- 编译与解释的常见实现方式，举例并说明不是绝对二分：','','## 2. 环境与构建','- 操作系统 / 工具链 / CMake 版本 / Python 版本：','- CMake 配置、构建、运行步骤与真实截图：','- Anaconda、环境名、实际解释器路径与截图：',''];for(const lang of ['C++ 版本','Python 版本']){lines.push('## '+lang);for(const t of ASSIGNMENTS.slice(0,5)){lines.push('### '+t.name,'1. 题意、输入与输出：','2. 我的设计步骤与流程图：','3. 带注释源码（粘贴本人源码）：','4. 真实运行结果 / 截图：','5. 测试表：输入 | 期望 | 实际 | 是否通过 | 证据路径','6. 失败、定位与修复：','7. 为什么这样做 / 还可以怎样做：','')}if(lang==='C++ 版本')lines.push('> 交换题：引用版和指针版均需记录。','');else lines.push('> 交换题：说明 Python 返回与接收的语义，不能照搬 int& / int*。','')}lines.push('## 学生信息管理系统（所选语言：____）','- 字段、类与容器选择：','- 人数容量与重复学号的约定（说明哪些已向出题人确认）：','- 总流程图、模块划分：','- 带注释源码：','- 五人初始化、增删改查/展示、三科与总分双向排序的真实证据：','- 总分同步、连续菜单与边界测试：','- 与其他数据结构/设计的取舍：','','## 总结与 AI 使用说明（学习建议）','- 我独立完成了什么：','- AI 帮助解释了哪些知识 / 调试了哪些问题：','- 我如何验证并理解这些内容：','- 尚未解决的问题：');downloadFile('考核报告空白模板.md',lines.join('\n'),'text/markdown;charset=utf-8')}
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.question&&quiz&&!quiz.submitted){quiz.answers[el.dataset.question]=Number(el.value);return}if(el.dataset.pref){state.prefs[el.dataset.pref]=el.dataset.pref==='deadline'?el.value:Number(el.value);save();const p=$('#plan-text');if(p)p.textContent=planView();return}if(el.dataset.check){const {check:kind,id,index}=el.dataset;if(kind==='module'){moduleData(id).checks[index]=el.checked;if(!el.checked)moduleData(id).doneAt=''}else if(kind==='task')taskData(id).checks[index]=el.checked;else if(kind==='submission')state.submission[index]=el.checked;save();const y=window.scrollY;render(false);window.scrollTo(0,y)}});
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset.note)return;const d=el.dataset.note==='module'?moduleData(el.dataset.id):taskData(el.dataset.id);d.note=el.value;save()});
async function shareSite(){
 const url='https://007x-sudo.github.io/sjzkh/';
 if(navigator.share){try{await navigator.share({title:'视觉组学习工作台',text:'零基础学习路线、练习和阶段自测',url});return}catch(error){if(error.name==='AbortError')return}}
 try{await navigator.clipboard.writeText(url);toast('网站链接已复制，可以发到手机或分享给同学。')}catch(_){window.prompt('复制这个网址，手机浏览器即可打开：',url)}
}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const id=b.dataset.id;switch(b.dataset.action){
case 'module-quiz':startQuiz(id);break;
case 'start-quiz':if(quiz&&!quiz.submitted&&Object.keys(quiz.answers).length&&!confirm('当前尚有未提交答案，重新开始会放弃这些答案。继续吗？'))return;startQuiz($('#quiz-scope').value);break;
case 'retry-quiz':startQuiz(quiz.mode==='module'?quiz.module:quiz.mode==='wrong'?'wrong':'all');break;
case 'submit-quiz':submitQuiz();break;
case 'complete':{const m=MODULES.find(m=>m.id===id);if(m&&qualified(m)){moduleData(id).doneAt=new Date().toISOString();save();render(false);toast('已通过本阶段自检。下一步练习独立编程与口述。')}break}
case 'mentor':{const m=MODULES.find(m=>m.id===id),text=`我正在从零学习“${m.title}”。请围绕“${m.goal}”辅导我：先用一个非考核原题的小例子解释，再让我预测输出，检查我的理解，最后给一个类似练习。请先提示，不直接给考核题完整答案。我目前卡在：____。我的代码、输入、期望、实际输出/报错：____。`;$('#mentor-result').textContent=text;toast('提问模板已显示在记录框下方，可选中复制。');break}
case 'export-backup':downloadFile('视觉组进度备份-'+localDay()+'.json',JSON.stringify(state,null,2),'application/json;charset=utf-8');break;
case 'export-notes':exportNotes();break;
case 'template':reportTemplate();break;
case 'share-site':await shareSite();break;
case 'import':$('#import-file').click();break;
case 'reset':if(confirm('清空当前浏览器中本页面的所有进度、笔记和自测记录？建议先导出备份。此操作不能在页面内撤销。')){state=fresh();quiz=null;save();render(false);toast('本页面进度已清空。')}break;
case 'lab-tab':labType=id;render(false);break;
case 'swap-reset':{const a=$('#swap-a'),c=$('#swap-b');if(!a.value||!c.value||!a.checkValidity()||!c.checkValidity()){toast('请输入 -100000 到 100000 的两个整数。');return}swapValues=[Number(a.value),Number(c.value)];swapStep=0;$('#lab-stage').innerHTML=labContent();break}
case 'swap-next':swapStep=Math.min(3,swapStep+1);$('#lab-stage').innerHTML=labContent();break;
case 'scan-next':scanStep=Math.min(10,scanStep+1);$('#lab-stage').innerHTML=labContent();break;
case 'scan-reset':scanStep=0;$('#lab-stage').innerHTML=labContent();break;
case 'loop-next':loopStep=Math.min(45,loopStep+1);$('#lab-stage').innerHTML=labContent();break;
case 'loop-reset':loopStep=0;$('#lab-stage').innerHTML=labContent();break;
case 'prime-run':{const input=$('#prime-n');if(!input.value||!input.checkValidity()){toast('请输入 -50 到 200 的整数。');return}const n=Number(input.value);if(n<2){$('#prime-output').textContent=`${n} 不大于 1，不是素数。不进入试除循环。`;return}let divisor=null,trials=[];for(let d=2;d*d<=n;d++){const rem=n%d;trials.push(`<span class="factor ${rem===0?'hit':''}">${n} % ${d} = ${rem}</span>`);if(rem===0){divisor=d;break}}$('#prime-output').innerHTML=`<b>${n} ${divisor?'不是':'是'}素数</b><div class="prime-grid">${trials.join('')||'<span>无须试除：没有大于等于 2 且不大于平方根的候选除数。</span>'}</div>${divisor?`找到因数 ${divisor} × ${n/divisor} = ${n}。`:'在必要范围内没有找到其他因数。'}`;break}
}});
$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5000000)throw new Error('备份超过 5 MB，请检查文件');const candidate=normalize(JSON.parse(await file.text()));if(!confirm('导入将替换此浏览器现有进度、笔记和历史。确认已保留所需备份并继续？'))return;state=candidate;quiz=null;save();render(false);toast('备份已导入，进度与笔记已恢复。')}catch(err){toast('无法导入：'+err.message+'。现有进度未改变。')}finally{e.target.value=''}});
window.addEventListener('hashchange',()=>render());
try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)state=normalize(JSON.parse(raw));$('#save-status').textContent='记录保存在此浏览器'}catch(_){warnStorage('无法读取旧记录或浏览器禁止本地存储。本次会话可继续，请导出备份；原存储未自动清除。')}
render();

</script></body></html>
