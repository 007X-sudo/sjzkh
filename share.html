<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手机打开 · 视觉组学习工作台</title><style>body{margin:0;background:#f4f6ef;color:#193c32;font:15px/1.9 "Microsoft YaHei",system-ui,sans-serif}main{max-width:580px;margin:35px auto;padding:25px;text-align:center}section{background:white;border:1px solid #dce4d4;border-radius:20px;padding:25px}img{width:min(290px,100%);display:block;margin:15px auto}a{color:#1b6a53;overflow-wrap:anywhere}button,.button{display:inline-block;margin:12px 5px;padding:10px 16px;background:#1b6a53;color:white;border:0;border-radius:10px;text-decoration:none;font:inherit;cursor:pointer}p{color:#64755c;font-size:13px}</style><main><h1>手机扫一扫，接着学。</h1><section><img src="share-qr.png" alt="学习网站二维码"><a id="url" href="./">https://007x-sudo.github.io/sjzkh/</a><div><a class="button" href="./">打开学习工作台</a><button id="copy">复制链接</button></div><p id="status" role="status" aria-live="polite"></p></section><p>手机可直接用浏览器打开，不需要与电脑连接同一 Wi-Fi，也不需要电脑保持开机。微信内功能受限时，请从右上角菜单选择“在浏览器打开”。</p><p>学习进度保存在各自浏览器，不自动同步。切换设备前导出 JSON，在另一端导入；请定期备份。</p></main><script>document.getElementById('copy').onclick=async()=>{const url='https://007x-sudo.github.io/sjzkh/';try{await navigator.clipboard.writeText(url);document.getElementById('status').textContent='已复制，发送给手机即可。'}catch(_){prompt('复制网站链接：',url)}};</script></html>
